[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airreview"
version = "0.1.0"
description = "Local-first agentic code review CLI for branch reviews and Azure DevOps pipelines."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AirReview" }]
dependencies = [
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "openai>=1.68.0",
  "azure-identity>=1.17.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
foundry = ["azure-ai-projects>=2.0.0b2"]

[project.scripts]
airreview = "airreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airreview = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
