name: AirReview GenAIOps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AirReview
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,foundry]"

      - name: Unit tests
        run: pytest

      - name: Local deterministic evals
        run: airreview eval --output airreview-eval-results.json

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: airreview-eval-results
          path: airreview-eval-results.json

  foundry-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test-evaluate
    outputs:
      can-sync: ${{ steps.check.outputs.can-sync }}
    steps:
      - name: Check Foundry configuration
        id: check
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing_sync=()
          for name in FOUNDRY_PROJECT_ENDPOINT FOUNDRY_MODEL AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              missing_sync+=("$name")
            fi
          done
          if [ "${#missing_sync[@]}" -eq 0 ]; then
            echo "can-sync=true" >> "$GITHUB_OUTPUT"
            echo "Foundry agent sync is configured."
          else
            echo "can-sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Foundry sync skipped::Missing variables: ${missing_sync[*]}"
          fi

  foundry-sync:
    if: ${{ needs.foundry-readiness.outputs.can-sync == 'true' }}
    runs-on: ubuntu-latest
    needs: foundry-readiness
    outputs:
      agent-refs: ${{ steps.agent_refs.outputs.agent-refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AirReview with Foundry support
        run: |
          python -m pip install --upgrade pip
          pip install ".[foundry]"

      - name: Sync Foundry prompt agents
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
        run: airreview foundry sync-agents --output-json foundry-agent-sync.json

      - name: Export synced agent refs
        id: agent_refs
        run: |
          python - <<'PY'
          import json
          import os

          rows = json.loads(open("foundry-agent-sync.json", encoding="utf-8").read())
          refs = []
          for row in rows:
            name = str(row.get("name") or "").strip()
            version = str(row.get("version") or "").strip()
            if not name or not version or version == "-":
              raise SystemExit(f"Cannot build agent ref from sync row: {row}")
            refs.append(f"{name}:{version}")
          value = ",".join(refs)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"agent-refs={value}\n")
          print(f"Foundry eval agent refs: {value}")
          PY

  foundry-agent-evals:
    if: ${{ needs.foundry-sync.outputs.agent-refs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs:
      - foundry-sync
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - kind: quality_smoke
            suite: evals/airreview_quality_smoke.json
          - kind: pessimistic_smoke
            suite: evals/airreview_pessimistic_smoke.json
          - kind: security_smoke
            suite: evals/airreview_security_smoke.json
          - kind: coding_smoke
            suite: evals/airreview_coding_smoke.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Microsoft eval action
        uses: actions/checkout@v4
        with:
          repository: microsoft/ai-agent-evals
          ref: v3-beta
          path: .github/actions/ai-agent-evals-airreview

      - name: Patch Foundry evaluation display name
        env:
          AIRREVIEW_EVAL_NAME: AirReview agent evaluation v${{ github.run_number }} ${{ matrix.kind }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          action = Path(".github/actions/ai-agent-evals-airreview/action.py")
          text = action.read_text(encoding="utf-8")
          old = 'name="Agent Evaluation",'
          new = 'name=os.getenv("AIRREVIEW_EVAL_NAME", "Agent Evaluation"),'
          if old not in text:
            raise SystemExit("Could not find hardcoded evaluation name in Microsoft action.")
          action.write_text(text.replace(old, new), encoding="utf-8")
          print("Patched evaluation name to:", os.environ["AIRREVIEW_EVAL_NAME"])
          PY

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure AI Foundry agent evaluations
        uses: ./.github/actions/ai-agent-evals-airreview
        env:
          AIRREVIEW_EVAL_NAME: AirReview agent evaluation v${{ github.run_number }} ${{ matrix.kind }}
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.FOUNDRY_MODEL }}
          agent-ids: ${{ needs.foundry-sync.outputs.agent-refs }}
          data-path: ${{ github.workspace }}/${{ matrix.suite }}
