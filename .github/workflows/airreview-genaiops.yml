name: AirReview GenAIOps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AirReview
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Unit tests
        run: pytest

      - name: Local deterministic evals
        run: airreview eval --output airreview-eval-results.json

      - name: AirReview PR quality gate
        if: github.event_name == 'pull_request'
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
        run: airreview --fetch --output --fail-on medium

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: airreview-eval-results
          path: airreview-eval-results.json

  foundry-evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.FOUNDRY_AGENT_IDS != '' }}
    runs-on: ubuntu-latest
    needs: test-evaluate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure AI Foundry agent evaluations
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.FOUNDRY_MODEL }}
          agent-ids: ${{ vars.FOUNDRY_AGENT_IDS }}
          data-path: ${{ github.workspace }}/evals/airreview_quality.jsonl
