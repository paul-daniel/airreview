name: AirReview GenAIOps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AirReview
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,foundry]"

      - name: Unit tests
        run: pytest

      - name: Local deterministic evals
        run: airreview eval --output airreview-eval-results.json

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: airreview-eval-results
          path: airreview-eval-results.json

  foundry-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test-evaluate
    outputs:
      can-sync: ${{ steps.check.outputs.can-sync }}
      can-eval: ${{ steps.check.outputs.can-eval }}
    steps:
      - name: Check Foundry configuration
        id: check
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FOUNDRY_AGENT_IDS: ${{ vars.FOUNDRY_AGENT_IDS }}
        run: |
          missing_sync=()
          for name in FOUNDRY_PROJECT_ENDPOINT FOUNDRY_MODEL AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              missing_sync+=("$name")
            fi
          done
          if [ "${#missing_sync[@]}" -eq 0 ]; then
            echo "can-sync=true" >> "$GITHUB_OUTPUT"
            echo "Foundry agent sync is configured."
          else
            echo "can-sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Foundry sync skipped::Missing variables: ${missing_sync[*]}"
          fi
          if [ "${#missing_sync[@]}" -eq 0 ] && [ -n "$FOUNDRY_AGENT_IDS" ]; then
            echo "can-eval=true" >> "$GITHUB_OUTPUT"
            echo "Foundry agent evaluations are configured."
          else
            echo "can-eval=false" >> "$GITHUB_OUTPUT"
            if [ -z "$FOUNDRY_AGENT_IDS" ]; then
              echo "::notice title=Foundry evals skipped::Set FOUNDRY_AGENT_IDS after the first agent sync."
            fi
          fi

  foundry-sync:
    if: ${{ needs.foundry-readiness.outputs.can-sync == 'true' }}
    runs-on: ubuntu-latest
    needs: foundry-readiness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AirReview with Foundry support
        run: |
          python -m pip install --upgrade pip
          pip install ".[foundry]"

      - name: Sync Foundry prompt agents
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
        run: airreview foundry sync-agents

  foundry-agent-evals:
    if: ${{ needs.foundry-readiness.outputs.can-eval == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - foundry-readiness
      - foundry-sync
    strategy:
      fail-fast: false
      matrix:
        suite:
          - evals/airreview_quality.quick.jsonl
          - evals/airreview_quality.pessimistic.jsonl
          - evals/airreview_security.guardrails.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure AI Foundry agent evaluations
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.FOUNDRY_MODEL }}
          agent-ids: ${{ vars.FOUNDRY_AGENT_IDS }}
          data-path: ${{ github.workspace }}/${{ matrix.suite }}
