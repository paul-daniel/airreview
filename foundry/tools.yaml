tools:
  context7_docs:
    type: mcp
    description: Version-aware documentation lookup through the Context7 remote MCP server.
    server_label: context7
    server_url: https://mcp.context7.com/mcp
    project_connection_id: ${AIRREVIEW_CONTEXT7_CONNECTION_ID}
    require_approval: never
    allowed_tools:
      - resolve-library-id
      - query-docs

  foundry_iq_review_knowledge:
    type: mcp
    description: AirReview review excellence and repository knowledge via Foundry IQ / Azure AI Search agentic retrieval.
    server_label: airreview-knowledge
    server_url: ${AIRREVIEW_FOUNDRY_IQ_MCP_ENDPOINT}
    project_connection_id: ${AIRREVIEW_FOUNDRY_IQ_CONNECTION_ID}
    require_approval: never
    optional: true
    allowed_tools:
      - knowledge_base_retrieve
