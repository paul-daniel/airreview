tools:
  context7_docs:
    type: mcp
    description: Version-aware documentation lookup through the Context7 remote MCP server.
    server_label: context7
    server_url: https://mcp.context7.com/mcp
    project_connection_id: ${AIRREVIEW_CONTEXT7_CONNECTION_ID}
    require_approval: never
    allowed_tools:
      - resolve-library-id
      - query-docs

  airreview_search_knowledge:
    type: azure_ai_search
    description: AirReview review excellence documents indexed in Azure AI Search.
    connection_name: ${AIRREVIEW_SEARCH_CONNECTION_NAME}
    project_connection_id: ${AIRREVIEW_SEARCH_PROJECT_CONNECTION_ID}
    index_name: ${AIRREVIEW_SEARCH_INDEX_NAME}
    query_type: simple
    top_k: 5
    optional: true
