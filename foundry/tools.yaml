tools:
  context7_docs:
    type: mcp
    description: Version-aware documentation lookup through the Context7 remote MCP server.
    server_label: context7
    server_url: https://mcp.context7.com/mcp
    project_connection_id: ${AIRREVIEW_CONTEXT7_CONNECTION_ID}
    require_approval: never
    allowed_tools:
      - resolve-library-id
      - query-docs

  airreview_file_search_knowledge:
    type: file_search
    description: AirReview review excellence documents in a managed Foundry file search vector store.
    vector_store_ids:
      - ${AIRREVIEW_FILE_SEARCH_VECTOR_STORE_ID}
    max_num_results: 5
    optional: true
